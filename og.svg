<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SafaiBook — the collection fee that collects itself. A KARYA studio build.">
  <title>SafaiBook — the collection fee that collects itself</title>

  <!-- ledger paper base -->
  <rect width="1200" height="630" fill="#F5F6F1"/>

  <!-- faint ledger rules -->
  <g stroke="#E2DFCF" stroke-width="2">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
  </g>

  <!-- green accent band down the left, like a ledger margin -->
  <rect x="0" y="0" width="18" height="630" fill="#16A34A"/>
  <rect x="90" y="0" width="2" height="630" fill="#D9EDDF"/>

  <!-- logo mark -->
  <g transform="translate(96,74)">
    <rect x="0" y="0" width="72" height="66" rx="8" fill="#16A34A"/>
    <rect x="0" y="0" width="19" height="66" rx="8" fill="#0F7C38"/>
    <path d="M32 22h30M32 36h30M32 50h20" stroke="#F5F6F1" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- brand name -->
  <text x="188" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    <tspan fill="#14211A">Safai</tspan><tspan fill="#16A34A">Book</tspan>
  </text>

  <!-- headline -->
  <text x="96" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#14211A">The collection fee</text>
  <text x="96" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#16A34A">that collects itself.</text>

  <!-- tagline -->
  <text x="98" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="500" fill="#445248">Dues by route, WhatsApp reminders &amp; numbered receipts for waste collectors.</text>

  <!-- footer row: KARYA wordmark + subscription note -->
  <g transform="translate(96,556)">
    <rect x="0" y="-26" width="150" height="42" rx="21" fill="#16A34A"/>
    <text x="75" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#F5F6F1">KARYA</text>
    <text x="172" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#445248">studio build · subscription · pricing on discovery</text>
  </g>

  <!-- mini register chip, top-right, echoing the product -->
  <g transform="translate(792,96)">
    <rect x="0" y="0" width="312" height="200" rx="16" fill="#FFFFFF" stroke="#CBD8CE" stroke-width="2"/>
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#14211A">Collection register</text>
    <rect x="228" y="24" width="64" height="26" rx="13" fill="#D9EDDF"/>
    <text x="260" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F7C38">Auto</text>

    <text x="24" y="92" font-family="-apple-system, sans-serif" font-size="17" fill="#445248">Kamala Devi</text>
    <rect x="204" y="76" width="88" height="24" rx="12" fill="#16A34A"/>
    <text x="248" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F5F6F1">Paid</text>

    <text x="24" y="132" font-family="-apple-system, sans-serif" font-size="17" fill="#445248">Iqbal Sheikh</text>
    <rect x="168" y="116" width="124" height="24" rx="12" fill="#D9EDDF"/>
    <text x="230" y="133" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F7C38">Reminder sent</text>

    <line x1="24" y1="156" x2="288" y2="156" stroke="#E2DFCF" stroke-width="2"/>
    <text x="24" y="182" font-family="-apple-system, sans-serif" font-size="14" fill="#445248">Collected</text>
    <text x="288" y="182" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#16A34A">Rs 18,240</text>
  </g>
</svg>
